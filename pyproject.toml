[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-shorts-analyzer"
version = "0.1.0"
description = "Local-first Windows frame capture and visual research studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11,<13",
  "PySide6>=6.8,<7",
  "playwright>=1.49,<2",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.11,<7"]

[project.scripts]
chess-shorts = "chess_shorts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
