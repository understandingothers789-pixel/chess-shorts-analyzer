name: Windows validation and desktop build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Install application and Chromium
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[package]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m playwright install chromium
          exit $LASTEXITCODE
      - name: Core, browser, and offscreen desktop tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          RUN_BROWSER_TESTS: '1'
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Build desktop executable
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ChessShortsStudio-windows
          path: dist/ChessShortsStudio/
          if-no-files-found: error
